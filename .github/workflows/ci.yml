name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      GITHUB_BEFORE_SHA: ${{ github.event.before }}
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Validate production Compose configuration
        run: docker compose --env-file tests/fixtures/compose-production.env -f compose.production.yml config --quiet

      - name: Check asset integrity
        run: pnpm assets:check

      - name: Generate Prisma client
        run: pnpm -C apps/web exec prisma generate

      - name: Lint relevant changes (full lint on uncertainty)
        run: pnpm lint:changed

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build:ci
